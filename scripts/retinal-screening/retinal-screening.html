<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Retinal AI Screening</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #fff;
            --text: #14181f;
            --muted: #667085;
            --line: #e4e7ec;
            --brand: #2563eb;
            --ok: #16a34a;
            --warn: #d97706;
            --bad: #dc2626;
            --r: 14px
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0e1116;
                --card: #171b22;
                --text: #eef1f5;
                --muted: #98a2b3;
                --line: #2a313c;
                --brand: #5b8cff
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 20px 16px 48px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px
        }

        h1 {
            font-size: 1.25rem;
            margin: 0
        }

        h1 small {
            display: block;
            color: var(--muted);
            font-weight: 400;
            font-size: .85rem
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 16px;
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr
        }

        @media(min-width:760px) {
            .grid {
                grid-template-columns: 1fr 1fr
            }
        }

        #drop {
            border: 2px dashed var(--line);
            border-radius: var(--r);
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            overflow: hidden
        }

        #drop.over {
            border-color: var(--brand)
        }

        #drop img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 380px;
            display: block
        }

        button {
            font: inherit;
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            font-weight: 600
        }

        button.ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line)
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .row>button {
            flex: 1
        }

        input[type=text] {
            width: 100%;
            font: inherit;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text)
        }

        label {
            font-size: .8rem;
            color: var(--muted);
            display: block;
            margin: 8px 0 4px
        }

        details summary {
            cursor: pointer;
            color: var(--muted);
            font-size: .9rem
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: 700;
            font-size: .95rem;
            color: #fff
        }

        .big {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 6px 0
        }

        .bar {
            margin: 10px 0
        }

        .bar .top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: .9rem
        }

        .track {
            height: 8px;
            background: var(--line);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px
        }

        .fill {
            height: 100%;
            background: var(--brand);
            width: 0;
            transition: width .6s ease
        }

        .err {
            border-color: var(--bad);
            color: var(--bad)
        }

        .spin {
            width: 22px;
            height: 22px;
            border: 3px solid var(--line);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: s .8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px
        }

        @keyframes s {
            to {
                transform: rotate(360deg)
            }
        }

        .note {
            font-size: .8rem;
            color: var(--muted)
        }

        .hm {
            width: 100%;
            border-radius: 10px;
            margin-top: 8px
        }

        .hidden {
            display: none
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Retinal AI Screening<small>Upload a fundus image for automated analysis</small></h1>
            <button class="ghost" id="themeBtn" aria-label="Toggle theme">◐</button>
        </header>

        <div class="grid">
            <section class="card">
                <div id="drop" tabindex="0" role="button" aria-label="Upload retinal image">
                    <div><strong>Tap to choose</strong> or drag &amp; drop<br><span class="note">JPG / PNG, up to 15
                            MB</span></div>
                </div>
                <input id="file" type="file" accept="image/jpeg,image/png" class="hidden">
                <div class="row">
                    <button id="analyze" disabled>Analyze image</button>
                    <button id="reset" class="ghost">Clear</button>
                </div>
                <details style="margin-top:14px">
                    <summary>API settings</summary>
                    <label for="url">Endpoint (POST, multipart)</label>
                    <input id="url" type="text" placeholder="http://localhost:8000/predict">
                    <label for="field">File field name</label>
                    <input id="field" type="text" value="file">
                    <label for="key">API key (optional)</label>
                    <input id="key" type="text">
                </details>
            </section>

            <section class="card" id="result" aria-live="polite">
                <div class="note">Results will appear here.</div>
            </section>
        </div>

        <p class="note">This tool provides AI-assisted screening only and is not a medical diagnosis. Results must be
            reviewed by a qualified eye-care professional.</p>
    </div>

    <script>
        const DEFAULTS = {
            url: "http://localhost:8000/predict",
            timeoutMs: 60000,
            maxBytes: 15 * 1024 * 1024,
            severity: { healthy: "ok", normal: "ok", mild: "warn", moderate: "warn", dry: "warn", severe: "bad", proliferative: "bad", advanced: "bad", wet: "bad" }
        };

        const $ = id => document.getElementById(id);
        const store = {
            get(k) { try { return localStorage.getItem(k); } catch { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch { } }
        };
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        let current = null, ctrl = null;

        $("url").value = store.get("rs_url") || DEFAULTS.url;
        $("field").value = store.get("rs_field") || "file";
        $("key").value = store.get("rs_key") || "";
        ["url", "field", "key"].forEach(id => $(id).addEventListener("change", () => store.set("rs_" + id, $(id).value.trim())));

        $("themeBtn").onclick = () => {
            const dark = matchMedia("(prefers-color-scheme: dark)").matches;
            const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
            document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
        };

        const drop = $("drop"), input = $("file");
        drop.onclick = () => input.click();
        drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
        ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
        ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
        drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
        input.onchange = () => setFile(input.files[0]);

        function setFile(f) {
            if (!f) return;
            if (!/^image\/(jpeg|png)$/.test(f.type)) return showError("Please upload a JPG or PNG image.");
            if (f.size > DEFAULTS.maxBytes) return showError("Image is too large (max 15 MB).");
            current = f;
            const img = new Image();
            img.src = URL.createObjectURL(f);
            img.alt = "Selected retinal image";
            drop.replaceChildren(img);
            $("analyze").disabled = false;
            $("result").className = "card";
            $("result").innerHTML = '<div class="note">Ready to analyze.</div>';
        }

        $("reset").onclick = () => {
            if (ctrl) ctrl.abort();
            current = null; input.value = "";
            drop.innerHTML = '<div><strong>Tap to choose</strong> or drag &amp; drop<br><span class="note">JPG / PNG, up to 15 MB</span></div>';
            $("analyze").disabled = true;
            $("result").className = "card";
            $("result").innerHTML = '<div class="note">Results will appear here.</div>';
        };

        $("analyze").onclick = async () => {
            if (!current) return;
            const url = $("url").value.trim();
            if (!url) return showError("Set the API endpoint in API settings.");
            store.set("rs_url", url);

            const fd = new FormData();
            fd.append($("field").value.trim() || "file", current);

            const headers = {};
            const key = $("key").value.trim();
            if (key) headers.Authorization = "Bearer " + key;

            ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), DEFAULTS.timeoutMs);
            $("analyze").disabled = true;
            $("result").className = "card";
            $("result").innerHTML = '<span class="spin"></span>Analyzing…';

            try {
                const res = await fetch(url, { method: "POST", body: fd, headers, signal: ctrl.signal });
                if (!res.ok) {
                    let detail = "";
                    try { const j = await res.json(); detail = j.detail || j.error || j.message || ""; } catch { }
                    throw new Error("Server returned " + res.status + (detail ? ": " + (typeof detail === "string" ? detail : JSON.stringify(detail)) : ""));
                }
                render(normalize(await res.json()));
            } catch (e) {
                const msg = e.name === "AbortError"
                    ? "The request timed out or was cancelled."
                    : (e instanceof TypeError ? "Could not reach the server. Check the URL and that the API is running." : e.message);
                showError(msg);
            } finally {
                clearTimeout(timer);
                $("analyze").disabled = !current;
            }
        };

        function normalize(d) {
            d = d.result || d.data || d;
            let probs = d.probabilities || d.probs || d.scores || null;
            if (Array.isArray(probs)) {
                const names = d.classes || d.labels || probs.map((_, i) => "Class " + i);
                probs = Object.fromEntries(probs.map((p, i) => [names[i], p]));
            }
            let label = d.prediction ?? d.label ?? d.class ?? d.diagnosis;
            let conf = d.confidence ?? d.score ?? d.probability;
            if (probs) {
                const top = Object.entries(probs).sort((a, b) => b[1] - a[1])[0];
                if (label == null) label = top[0];
                if (conf == null) conf = probs[label] ?? top[1];
            }
            if (label == null) throw new Error("Unexpected response format from the API.");
            let hm = d.heatmap || d.gradcam || d.overlay || null;
            if (hm && !/^(data:|https?:|\/)/.test(hm)) hm = "data:image/png;base64," + hm;
            return { label: String(label), conf: conf == null ? null : Number(conf), probs, hm };
        }

        function sevClass(label) {
            const l = label.toLowerCase();
            for (const k in DEFAULTS.severity) if (l.includes(k)) return DEFAULTS.severity[k];
            return "warn";
        }
        const pct = n => (n <= 1 ? n * 100 : n).toFixed(1) + "%";

        function render(r) {
            const sev = sevClass(r.label);
            let h = '<span class="badge" style="background:var(--' + sev + ')">' + (sev === "ok" ? "Low concern" : sev === "bad" ? "Needs review" : "Monitor") + "</span>";
            h += '<div class="big">' + esc(r.label) + "</div>";
            if (r.conf != null && !isNaN(r.conf)) h += '<div class="note">Model confidence: ' + pct(r.conf) + "</div>";
            if (r.probs) {
                h += '<div style="margin-top:12px">';
                Object.entries(r.probs).sort((a, b) => b[1] - a[1]).slice(0, 5).forEach(([k, v]) => {
                    h += '<div class="bar"><div class="top"><span>' + esc(k) + "</span><span>" + pct(v) + '</span></div><div class="track"><div class="fill" data-w="' + Math.min(100, v <= 1 ? v * 100 : v) + '"></div></div></div>';
                });
                h += "</div>";
            }
            if (r.hm) h += '<details open><summary>Attention heatmap</summary><img class="hm" alt="Model attention heatmap" src="' + esc(r.hm) + '"></details>';
            $("result").className = "card";
            $("result").innerHTML = h;
            requestAnimationFrame(() => document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
        }

        function showError(msg) {
            $("result").className = "card err";
            $("result").textContent = msg;
        }
    </script>
</body>

</html>
